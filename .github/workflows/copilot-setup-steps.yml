name: Copilot setup steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Prepare verified SDK source before agent execution
        shell: pwsh
        env:
          MSAL_SOURCE_TARGET_VERSION: ${{ vars.MSAL_SOURCE_TARGET_VERSION || '4.91.1' }}
        run: |
          $manifestPath = ./scripts/Get-MsalSourceEvidence.ps1 `
            -TargetVersion $env:MSAL_SOURCE_TARGET_VERSION `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE '.maintenance-evidence')
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          foreach ($release in $manifest.releases) {
            if (!(Test-Path (Join-Path $release.sourcePath 'src/client')) -or
                !(Test-Path (Join-Path $release.sourcePath 'tests'))) {
              throw 'SDK source/test trees are missing after setup.'
            }
            Write-Host "Prepared MSAL $($release.version), commit $($release.commit): $($release.sourcePath)"
          }
          "MSAL_SOURCE_MANIFEST=$manifestPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Prepared source evidence: $manifestPath" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Verify source handoff for agent
        shell: bash
        run: |
          test -s .maintenance-evidence/manifest.json
          test -s "$MSAL_SOURCE_MANIFEST"
          git check-ignore --quiet .maintenance-evidence/manifest.json
      - name: Restore pilot dependencies
        run: dotnet restore console-cli/cli.csproj --verbosity minimal