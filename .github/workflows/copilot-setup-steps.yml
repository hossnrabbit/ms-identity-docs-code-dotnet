name: Copilot setup steps

on:
  workflow_dispatch:
    inputs:
      package:
        description: Existing MSAL.NET or IdWeb package to prepare
        required: true
        type: string
      target_version:
        description: Exact stable target package version
        required: true
        type: string
      smoke_sample:
        description: Optional existing cross-platform sample for disposable exact-version build smoke
        required: false
        type: string
      dependency_sample:
        description: Optional pristine Web sample for supplemental Abstractions source and dependency graphs
        required: false
        type: string
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Check complete catalog and offline harness guards
        shell: pwsh
        run: ./scripts/Test-Maintenance.ps1
      - name: Prepare verified SDK source before agent execution
        shell: pwsh
        env:
          SOURCE_PACKAGE: ${{ inputs.package || vars.MAINTENANCE_PACKAGE }}
          SOURCE_TARGET_VERSION: ${{ inputs.target_version || vars.MAINTENANCE_TARGET_VERSION }}
          DEPENDENCY_SAMPLE: ${{ inputs.dependency_sample }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:SOURCE_PACKAGE) { $env:SOURCE_PACKAGE = $env:MAINTENANCE_PACKAGE }
          if (!$env:SOURCE_TARGET_VERSION) { $env:SOURCE_TARGET_VERSION = $env:MAINTENANCE_TARGET_VERSION }
          if (!$env:SOURCE_PACKAGE -or !$env:SOURCE_TARGET_VERSION) {
            throw 'SETUP_BLOCKED: configure matching MAINTENANCE_PACKAGE and MAINTENANCE_TARGET_VERSION as Agents variables before an agent session, or supply both workflow inputs for a setup smoke test.'
          }
          . ./scripts/Maintenance.Common.ps1
          $source = Get-MaintenanceSource -Package $env:SOURCE_PACKAGE
          $selected = @(Select-MaintenanceSamples -Samples @(Get-MaintenanceSamples) -Package $env:SOURCE_PACKAGE)
          $manifestPath = ./scripts/Get-MaintenanceSourceEvidence.ps1 `
            -Package $env:SOURCE_PACKAGE `
            -TargetVersion $env:SOURCE_TARGET_VERSION `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE '.maintenance-evidence')
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.schemaVersion -ne 2 -or $manifest.sourceProvenance -cne 'nuget-repository-commit' -or $manifest.package -cne $env:SOURCE_PACKAGE -or
              $manifest.repository -cne $source.repositoryUrl -or $manifest.samples.Count -ne $selected.Count) {
            throw 'Expected matching schema-2 package, upstream, and selected samples.'
          }
          foreach ($release in $manifest.releases) {
            if (!(Test-Path (Join-Path $release.sourcePath 'src')) -or
                !(Test-Path (Join-Path $release.sourcePath 'tests'))) {
              throw 'SDK source/test trees are missing after setup.'
            }
            Write-Host "Prepared $($manifest.package) $($release.version), NuGet commit $($release.commit), advisory tag $($release.tagObservation.status): $($release.sourcePath)"
          }
          ./scripts/Validate-Maintenance.ps1 -Package $env:SOURCE_PACKAGE -ExpectedVersion $env:SOURCE_TARGET_VERSION -EvidenceManifest $manifestPath -CheckOnly -SetupCheck
          if (!$env:DEPENDENCY_SAMPLE) { $env:DEPENDENCY_SAMPLE = $env:MAINTENANCE_DEPENDENCY_SAMPLE }
          if ($env:DEPENDENCY_SAMPLE) {
            $dependencyPath = ./scripts/Get-MaintenanceDependencyEvidence.ps1 -EvidenceManifest $manifestPath -SampleId $env:DEPENDENCY_SAMPLE
            ./scripts/Validate-Maintenance.ps1 -Package $env:SOURCE_PACKAGE -ExpectedVersion $env:SOURCE_TARGET_VERSION -EvidenceManifest $manifestPath -CheckOnly -SetupCheck
            "MAINTENANCE_DEPENDENCY_MANIFEST=$dependencyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "Prepared supplemental dependency/source evidence: $dependencyPath" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          "MAINTENANCE_SOURCE_MANIFEST=$manifestPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Prepared source evidence: $manifestPath" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $manifest.samples | Select-Object id, originalVersion, baselineVersion, targetVersion, status, setupError |
            Format-Table -Wrap | Out-String | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          foreach ($sample in $manifest.samples | Where-Object status -EQ 'setup-blocked') {
            Write-Warning "SETUP_BLOCKED $($sample.id): $($sample.setupError)"
          }
          'Linux setup does not validate Windows desktop or legacy MAUI builds. See platform CI and report missing checks as NOT RUN.' |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Smoke-test exact-version sample update without retaining edits
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_sample != '' }}
        shell: pwsh
        env:
          SMOKE_SAMPLE: ${{ inputs.smoke_sample }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/Maintenance.Common.ps1
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE '.maintenance-evidence/manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $samples = @(Select-MaintenanceSamples -Samples @(Get-MaintenanceSamples) -Package $manifest.package -SampleId $env:SMOKE_SAMPLE)
          if ($samples.Count -ne 1 -or $samples[0].platform -cne 'any') { throw 'Smoke build requires one existing cross-platform sample.' }
          $sample = $samples[0]
          $record = $manifest.samples | Where-Object id -CEQ $sample.id
          if ($record.status -cnotin @('update', 'current')) { throw 'Smoke build requires applicable verified evidence; no blocked update or downgrade.' }
          $projectPath = Join-Path $env:GITHUB_WORKSPACE $sample.project
          $original = [IO.File]::ReadAllBytes($projectPath)
          try {
            [xml] $project = Get-Content -LiteralPath $projectPath -Raw
            $references = @($project.SelectNodes('//PackageReference') | Where-Object { $_.GetAttribute('Include') -ceq $manifest.package })
            if ($references.Count -ne 1) { throw 'Expected one original direct package reference.' }
            $references[0].SetAttribute('Version', $manifest.targetVersion)
            $project.Save($projectPath)
            ./scripts/Validate-Maintenance.ps1 -Package $manifest.package -ExpectedVersion $manifest.targetVersion -EvidenceManifest $manifestPath -SampleId $sample.id -BuildPlatform any -RequireAllBuilds
            "PASS: disposable $($sample.id) exact-version update/build for $($manifest.package) $($manifest.targetVersion). Not an agent plan, source improvement, reviewed PR, or sign-in test." |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } finally { [IO.File]::WriteAllBytes($projectPath, $original) }
          ./scripts/Validate-Maintenance.ps1 -Package $manifest.package -ExpectedVersion $manifest.targetVersion -EvidenceManifest $manifestPath -CheckOnly -SetupCheck
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Disposable smoke test did not restore the pristine checkout.' }
      - name: Verify source handoff for agent
        shell: bash
        run: |
          test -s .maintenance-evidence/manifest.json
          test -s "$MAINTENANCE_SOURCE_MANIFEST"
          git check-ignore --quiet .maintenance-evidence/manifest.json